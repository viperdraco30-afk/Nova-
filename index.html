if('speechSynthesis' in window)speechSynthesis.getVoices();

function fit(A){const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let i=0;i<N;i++)for(let k=0;k<3;k++){const v=A[i*3+k];if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v}
 const s=1.1/(Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2),c=mn.map((v,k)=>(v+mx[k])/2);for(let i=0;i<N;i++)for(let k=0;k<3;k++)A[i*3+k]=(A[i*3+k]-c[k])*s;return A}
function reg(key,n,kw,A){cache[key]=fit(A);SH[key]={n,k:kw,d:null};if(!names.includes(key)){names.push(key);const b=document.createElement('button');b.textContent=n.replace(/^(un|una|la|tu) /,'');b.onclick=()=>handle(kw[0]);$('chips').appendChild(b)}setShape(key);say('¡De una! Mire cómo me convierto en '+n+'.')}
function loadImg(f){const im=new Image();im.onload=()=>{const sc=Math.min(1,300/Math.max(im.width,im.height)),w=Math.max(2,im.width*sc|0),h=Math.max(2,im.height*sc|0),cn=document.createElement('canvas');cn.width=w;cn.height=h;const x=cn.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const D=x.getImageData(0,0,w,h).data;
 const cr=[0,w-1,(h-1)*w,h*w-1],bc=[0,1,2].map(k=>cr.reduce((s,p)=>s+D[p*4+k],0)/4),tr=cr.some(p=>D[p*4+3]<30);let px=[];
 for(let p=0;p<w*h;p++){if(D[p*4+3]<40||(!tr&&Math.hypot(D[p*4]-bc[0],D[p*4+1]-bc[1],D[p*4+2]-bc[2])<40))continue;px.push(p)}
 if(px.length<w*h*.03){px=[];for(let p=0;p<w*h;p++)px.push(p)}
 const A=new Float32Array(N*3),K=new Float32Array(N*3);
 for(let i=0;i<N;i++){const p=px[Math.random()*px.length|0],r=D[p*4]/255,g=D[p*4+1]/255,b=D[p*4+2]/255,l=.3*r+.59*g+.11*b;
  A[i*3]=p%w+R(.5);A[i*3+1]=-((p/w|0)+R(.5));A[i*3+2]=(l-.5)*w*.12+R(1.5);K[i*3]=.2+.8*r;K[i*3+1]=.2+.8*g;K[i*3+2]=.2+.8*b}
 IC=K;reg('imagen','la imagen',['imagen','foto','dibujo'],A);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)}
function fromTris(V,F){if(!F.length){say('No pude leer ese modelo, parce.');return}
 const cum=new Float64Array(F.length);let tot=0;for(let i=0;i<F.length;i++){const[a,b,c]=F[i],p=V[a],q=V[b],r=V[c],u=[q[0]-p[0],q[1]-p[1],q[2]-p[2]],v=[r[0]-p[0],r[1]-p[1],r[2]-p[2]];tot+=.5*Math.hypot(u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]);cum[i]=tot}
 const O=new Float32Array(N*3);for(let i=0;i<N;i++){const r=Math.random()*tot;let lo=0,hi=F.length-1;while(lo<hi){const m=lo+hi>>1;cum[m]<r?lo=m+1:hi=m}
  const[a,b,c]=F[lo];let u=Math.random(),v=Math.random();if(u+v>1){u=1-u;v=1-v}for(let k=0;k<3;k++)O[i*3+k]=V[a][k]+u*(V[b][k]-V[a][k])+v*(V[c][k]-V[a][k])}
 IC=null;reg('modelo','tu modelo 3D',['modelo'],O)}
function loadObj(f){f.text().then(t=>{const V=[],F=[];for(const l of t.split('\n')){const a=l.trim().split(/\s+/);if(a[0]=='v')V.push([+a[1],+a[2],+a[3]]);else if(a[0]=='f'){const q=a.slice(1).map(u=>{const n=parseInt(u);return n<0?V.length+n:n-1});for(let k=1;k<q.length-1;k++)F.push([q[0],q[k],q[k+1]])}}fromTris(V,F)})}
function loadStl(f){f.arrayBuffer().then(b=>{const dv=new DataView(b),V=[],F=[],z=(x,y,w)=>V.push([x,w,-y]);
 if(b.byteLength>84&&b.byteLength==84+dv.getUint32(80,true)*50){const n=dv.getUint32(80,true);for(let i=0;i<n;i++){const o=84+i*50+12;for(let k=0;k<3;k++)z(dv.getFloat32(o+k*12,true),dv.getFloat32(o+k*12+4,true),dv.getFloat32(o+k*12+8,true));F.push([i*3,i*3+1,i*3+2])}}
 else{const t=new TextDecoder().decode(b),r=/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g;let m;while(m=r.exec(t))z(+m[1],+m[2],+m[3]);for(let i=0;i+2<V.length;i+=3)F.push([i,i+1,i+2])}fromTris(V,F)})}
function loadGlb(f){f.arrayBuffer().then(b=>{const dv=new DataView(b);if(dv.getUint32(0,true)!=0x46546C67){say('Ese .glb no parece válido, parce.');return}
 let o=12,J,B;while(o<b.byteLength){const l=dv.getUint32(o,true),t=dv.getUint32(o+4,true);if(t==0x4E4F534A)J=JSON.parse(new TextDecoder().decode(new Uint8Array(b,o+8,l)));else if(t==0x004E4942)B=new DataView(b,o+8,l);o+=8+l}
 if(!J||!B){say('No encontré la geometría dentro del .glb.');return}
 if((J.extensionsRequired||[]).some(e=>/draco|meshopt/i.test(e))){say('Ese .glb viene comprimido con Draco o Meshopt. Expórtelo sin compresión y lo cargo.');return}
 const G={5126:'getFloat32',5125:'getUint32',5123:'getUint16',5121:'getUint8'},S={5126:4,5125:4,5123:2,5121:1};
 const acc=i=>{const a=J.accessors[i],v=J.bufferViews[a.bufferView],n={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type],s=S[a.componentType],st=v.byteStride||n*s,off=(v.byteOffset||0)+(a.byteOffset||0),g=G[a.componentType],out=new Float64Array(a.count*n);
  for(let k=0;k<a.count;k++)for(let c=0;c<n;c++)out[k*n+c]=B[g](off+k*st+c*s,true);return out};
 const V=[],F=[],mt=n=>{const m=new THREE.Matrix4();n.matrix?m.fromArray(n.matrix):m.compose(new THREE.Vector3(...(n.translation||[0,0,0])),new THREE.Quaternion(...(n.rotation||[0,0,0,1])),new THREE.Vector3(...(n.scale||[1,1,1])));return m};
 const walk=(i,pm)=>{const n=J.nodes[i],m=pm.clone().multiply(mt(n));if(n.mesh!=null)for(const pr of J.meshes[n.mesh].primitives){if(pr.mode!=null&&pr.mode!=4)continue;const P=acc(pr.attributes.POSITION),base=V.length,v=new THREE.Vector3();
   for(let k=0;k<P.length;k+=3){v.set(P[k],P[k+1],P[k+2]).applyMatrix4(m);V.push([v.x,v.y,v.z])}const I=pr.indices!=null?acc(pr.indices):null,cnt=I?I.length:P.length/3;for(let k=0;k+2<cnt;k+=3)F.push(I?[base+I[k],base+I[k+1],base+I[k+2]]:[base+k,base+k+1,base+k+2])}(n.children||[]).forEach(c=>walk(c,m))};
 const roots=(J.scenes&&J.scenes[J.scene||0]||{nodes:[0]}).nodes;try{roots.forEach(i=>walk(i,new THREE.Matrix4()));fromTris(V,F)}catch(e){say('No pude leer ese .glb, parce. Pruebe con .stl u .obj.')}})}
function loadFile(f){if(!f)return;/\.obj$/i.test(f.name)?loadObj(f):/\.glb$/i.test(f.name)?loadGlb(f):/\.stl$/i.test(f.name)?loadStl(f):f.type.startsWith('image/')?loadImg(f):say('Formato no soportado. Use una imagen o un modelo .glb, .stl u .obj.')}
$('img').onclick=()=>$('fi').click();$('fi').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
const ck=()=>{const d=new Date();$('clk').innerHTML=d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'<br>'+d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})};ck();setInterval(ck,1000);
$('vz').onclick=()=>{if(!('speechSynthesis' in window))return;const l=esV();if(!l.length){say('Su dispositivo no tiene voces en español instaladas, parce.');return}VI=(VI+1)%l.length;say('¿Qué más, parce? ¿Así me escucha mejor?');tx.textContent+=' ('+l[VI].name+')'};
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
function activate(){if(speaking){speechSynthesis.cancel();speaking=false;st.textContent=listening?'Escuchando':'En espera';if(listening)return}
 $('mic').onclick();if(listening)setTimeout(()=>say('¿Qué más, parce? Lo escucho.'),200)}
